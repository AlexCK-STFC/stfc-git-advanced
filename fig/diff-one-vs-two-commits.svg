<rect x="515" y="320" width="460" height="20" fill="#ccffd8" stroke="none" stroke-width="0" rx="0"/>
<text x="521" y="334" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#0b6b1f" font-weight="normal" text-anchor="start" xml:space="preserve">+     &quot;&quot;&quot;Scale y. mode is &#x27;range&#x27;, &#x27;max&#x27; or &#x27;area&#x27;.&quot;&quot;&quot;</text>
<rect x="515" y="340" width="460" height="20" fill="#fafafa" stroke="none" stroke-width="0" rx="0"/>
<text x="521" y="354" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#555" font-weight="normal" text-anchor="start" xml:space="preserve">      y = np.asarray(y, dtype=float)</text>
<rect x="515" y="360" width="460" height="20" fill="#ccffd8" stroke="none" stroke-width="0" rx="0"/>
<text x="521" y="374" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#0b6b1f" font-weight="normal" text-anchor="start" xml:space="preserve">+     if mode == &quot;range&quot;:</text>
<rect x="515" y="380" width="460" height="20" fill="#ccffd8" stroke="none" stroke-width="0" rx="0"/>
<text x="521" y="394" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#0b6b1f" font-weight="normal" text-anchor="start" xml:space="preserve">+         return (y - y.min()) / (y.max() - y.min())</text>
<rect x="515" y="400" width="460" height="20" fill="#ccffd8" stroke="none" stroke-width="0" rx="0"/>
<text x="521" y="414" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" fill="#0b6b1f" font-weight="normal" text-anchor="start" xml:space="preserve">+     ...</text>
<text x="745" y="454" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#0b6b1f" font-weight="bold" text-anchor="middle" xml:space="preserve">A small diff about one idea.</text>
<text x="745" y="474" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">Spend your attention on this one.</text>
